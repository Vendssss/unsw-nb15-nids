[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.1.0"
description = "Network intrusion detection on UNSW-NB15"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Let tests import `nids` from src/ even before `pip install -e .`.
pythonpath = ["src"]
testpaths = ["tests"]
